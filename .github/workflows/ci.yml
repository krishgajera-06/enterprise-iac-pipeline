name: Enterprise IaC Pipeline

on:
  push:
    branches:
      - develop
      - feature/**
  pull_request:
    branches:
      - develop

jobs:
  ci:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Node.js
        run: |
          node -v
          npm -v

      - name: Install Dependencies
        working-directory: app
        run: npm install

      - name: Build Docker Image
        run: docker build -t enterprise-app:latest .

      - name: Verify Docker Image
        run: docker images

      - name: Trivy Vulnerability Scan
        run: |
          trivy image --severity CRITICAL,HIGH --exit-code 0 enterprise-app:latest

      - name: Pipeline Completed
        run: echo CI Pipeline completed successfully.